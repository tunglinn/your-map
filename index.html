<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>your-map</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    background: white; border-radius: 12px 12px 0 0; box-shadow: 0 -2px 10px rgba(0,0,0,.15);
    max-height: 40%; overflow-y: auto; padding: 10px 14px; display: none;
  }
  #panel.open { display: block; }
  #panel h3 { margin: 4px 0; }
  #panel button { font-size: 14px; padding: 6px 10px; margin: 4px 4px 4px 0; }
  #toolbar { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; flex-direction: column; gap: 6px; }
  #toolbar button {
    width: 40px; height: 40px; border-radius: 20px; border: none; background: white;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 18px;
  }
  .fav-item, .route-info { padding: 4px 0; border-bottom: 1px solid #eee; }
  #closePanel { position: absolute; top: 4px; right: 10px; border: none; background: none; font-size: 18px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="toolbar">
  <button id="locateBtn" title="My location">📍</button>
  <button id="favBtn" title="Favorites">⭐</button>
</div>

<div id="panel">
  <button id="closePanel">✕</button>
  <div id="panelContent"></div>
</div>

<script type="importmap">
{ "imports": { "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@4/+esm" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
