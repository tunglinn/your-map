<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>your-map</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: white; border-radius: 12px 12px 0 0; box-shadow: 0 -2px 10px rgba(0,0,0,.15);
    max-height: 40%; overflow-y: auto; padding: 10px 14px; display: none;
  }
  #panel.open { display: block; }
  #panel h3 { margin: 4px 0; }
  #panel button { font-size: 14px; padding: 6px 10px; margin: 4px 4px 4px 0; }
  #panel button.btn-primary {
    background: #1a73e8; color: white; border: none; border-radius: 18px;
    padding: 10px 20px; font-size: 15px; font-weight: bold;
  }
  #searchBar {
    position: absolute; top: 10px; left: 10px; right: 60px; z-index: 1000;
    background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.3);
    display: flex; align-items: center; padding: 4px 8px;
  }
  #searchBar.hidden { display: none; }
  #searchBar input {
    flex: 1; min-width: 0; border: none; outline: none; font-size: 15px; padding: 8px 4px;
  }
  #searchBar button { border: none; background: none; font-size: 18px; padding: 4px 6px; }
  #routeBar {
    position: absolute; top: 10px; left: 10px; right: 60px; z-index: 1000;
    background: white; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.3);
    padding: 8px 28px 8px 10px; display: none; font-size: 14px;
  }
  #routeBar.open { display: block; }
  #routeBar .route-row { display: flex; align-items: center; margin: 3px 0; }
  #routeBar .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  #routeBar .dot.start { background: #1a73e8; }
  #routeBar .dot.end { background: #d93025; }
  #routeBar .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #routeBar .label.active { color: #1a73e8; font-weight: bold; }
  #cancelRouteBtn {
    position: absolute; top: 6px; right: 6px; border: none; background: none; font-size: 16px;
  }
  #toolbar { position: absolute; top: 10px; right: 10px; z-index: 1000; }
  #toolbar button {
    display: block; width: 40px; height: 40px; border-radius: 20px; border: none; background: white;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 18px; margin-bottom: 6px;
  }
  .fav-item { padding: 4px 0; border-bottom: 1px solid #eee; }
  #closePanel { position: absolute; top: 4px; right: 10px; border: none; background: none; font-size: 18px; }
  #toast {
    position: absolute; top: 10px; left: 50%; margin-left: -140px; width: 280px;
    z-index: 1000; background: rgba(0,0,0,.8); color: white; padding: 8px 12px;
    border-radius: 8px; font-size: 13px; text-align: center; display: none;
  }
  #debugConsole {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: white; border-radius: 12px 12px 0 0; box-shadow: 0 -2px 10px rgba(0,0,0,.15);
    height: 50%; padding: 8px 10px; display: none;
  }
  #debugConsole.open { display: block; }
  #debugConsoleHeader { font: bold 13px -apple-system, sans-serif; margin-bottom: 6px; }
  #debugConsoleHeader button { font-size: 13px; padding: 4px 8px; margin-left: 6px; }
  #debugConsoleText {
    width: 100%; height: calc(100% - 30px); box-sizing: border-box;
    font: 11px/1.4 Menlo, monospace; border: 1px solid #ddd; padding: 6px; resize: none;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="toast"></div>

<div id="searchBar">
  <input id="searchInput" type="text" placeholder="Search for a place" enterkeyhint="search">
  <button id="searchBtn" title="Search">🔍</button>
</div>

<div id="routeBar">
  <button id="cancelRouteBtn">✕</button>
  <div class="route-row"><span class="dot start"></span><span class="label" id="startLabel"></span></div>
  <div class="route-row"><span class="dot end"></span><span class="label" id="endLabel"></span></div>
</div>

<div id="toolbar">
  <button id="locateBtn" title="My location">📍</button>
  <button id="favBtn" title="Favorites">⭐</button>
  <button id="consoleBtn" title="Debug console">🐞</button>
</div>

<div id="panel">
  <button id="closePanel">✕</button>
  <div id="panelContent"></div>
</div>

<div id="debugConsole">
  <div id="debugConsoleHeader">
    Console
    <button id="debugConsoleClear">Clear</button>
    <button id="debugConsoleClose">✕</button>
  </div>
  <textarea id="debugConsoleText" readonly></textarea>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="src/app.js"></script>
</body>
</html>
